name: builder

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '49 23 * * *'

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            ecj \
            fastjar \
            file \
            g++ \
            gawk \
            gettext \
            git \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            python-is-python3 \
            rsync \
            subversion \
            swig \
            time \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev

      - name: Check Python distutils
        run: |
          python3 --version
          python3 -c "from distutils import util; print('distutils OK')"

      - name: Download ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/21.02.1/targets/ramips/mt76x8/openwrt-imagebuilder-21.02.1-ramips-mt76x8.Linux-x86_64.tar.xz

      - name: Extract ImageBuilder
        run: |
          tar -xJf openwrt-imagebuilder-21.02.1-ramips-mt76x8.Linux-x86_64.tar.xz

      - name: Build firmware
        run: |
          cd openwrt-imagebuilder-21.02.1-ramips-mt76x8.Linux-x86_64

          make image \
            PROFILE="tplink_tl-mr6400-v4" \
            PACKAGES="uhttpd luci luci-theme-bootstrap modemmanager -nodogsplash -ppp -ppp-mod-pppoe -ip6tables -odhcp6c -kmod-ipv6 -kmod-ip6tables -odhcpd-ipv6only"

      - name: Generate release tag
        run: |
          echo "TAG_NAME=v$(date '+%Y%m%d')" >> "$GITHUB_ENV"

      - name: Publish release
        uses: svenstaro/upload-release-action@v2
        with:
          body: "OpenWrt 21.02.1 for TP-Link TL-MR6400 V3 with ModemManager and LuCI."
          file: openwrt-imagebuilder-21.02.1-ramips-mt76x8.Linux-x86_64/bin/targets/ramips/mt76x8/*.bin
          file_glob: true
          tag: ${{ env.TAG_NAME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
